name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installer as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - 'arena/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional. When this secret exists the installer is built with the
      # credential already inside it. Secrets cannot be read in a step `if:`,
      # so it is lifted into the environment first.
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      NEXUS_BASE_URL: ${{ vars.NEXUS_BASE_URL }}
      NEXUS_MODEL: ${{ vars.NEXUS_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Stage the embedded credential
        if: ${{ env.NEXUS_API_KEY != '' }}
        run: node scripts/stage-embedded-credential.mjs

      - name: Report the embedded credential
        shell: pwsh
        run: |
          if (Test-Path resources/bootstrap.json) {
            Write-Output 'This installer ships with a provider credential already configured.'
          } else {
            Write-Output 'No credential embedded.'
          }

      - name: Bundle main, preload and renderer
        run: npx electron-vite build

      - name: Build Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath builder.log
          if ($LASTEXITCODE -ne 0) {
            # Runner logs are not always reachable; surface the failure as an annotation.
            $tail = (Get-Content builder.log -Tail 40) -join ' | '
            Write-Output "::error::electron-builder failed: $tail"
            exit 1
          }

      - name: Collect artefacts
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: NexusCode-Setup
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build.${{ github.run_number }}"
          gh release create $tag (Get-ChildItem release/*.exe).FullName `
            --title "Nexus Code $version (build ${{ github.run_number }})" `
            --notes "Unsigned Windows x64 installer built from ``${{ github.sha }}``.

          $(if (Test-Path resources/bootstrap.json) { 'This build ships a pre-provisioned API credential: it is ready to use on first launch, and must only be shared with people allowed to use that key.' } else { 'No credential is embedded: configure the provider on first launch.' })

          Windows SmartScreen will warn about an unknown publisher because the binary is not code-signed: choose **More info -> Run anyway**, or sign it with your own certificate." `
            --target ${{ github.sha }}
