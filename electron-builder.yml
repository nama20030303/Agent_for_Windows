appId: ai.nexuscode.desktop
productName: Nexus Code
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
# Optional pre-provisioned credential for privately distributed builds: drop a
# resources/bootstrap.json before packaging and the installer ships ready to use.
# Never committed, and never added to public releases — an embedded key can be
# extracted from any binary you hand out.
extraResources:
  - from: resources
    to: .
    filter:
      - bootstrap.json
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: NexusCode-Setup-${version}.${ext}
nsis:
  oneClick: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus Code
  deleteAppDataOnUninstall: false
